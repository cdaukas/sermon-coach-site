<svg viewBox="0 0 760 580" xmlns="http://www.w3.org/2000/svg" font-family="'Iowan Old Style','Charter',Georgia,serif" role="img" aria-label="The preaching rhythm in two rows. Top row: pray and study, then sketch the outline with Sermon Coach, then write the sermon. Bottom row: strengthen the manuscript with Sermon Coach, then preach the sermon, then keep growing from the transcript with Sermon Coach.">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c486"/>
      <stop offset="0.5" stop-color="#c9a55c"/>
      <stop offset="1" stop-color="#a67c2e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="580" fill="#faf8f3"/>

  <!-- ============ REFINER'S FIRE BEHIND THE THREE SERMON COACH STEPS (2, 4, 6) ============ -->
  <g>
    <g transform="translate(380,137) scale(6.2) translate(-12,-12)"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.005A5.99 5.99 0 0 1 12.49 10.5a3.75 3.75 0 0 1 3.26 3.75Z" fill="#c9a55c" opacity="0.28"/></g>
    <g transform="translate(160,397) scale(6.2) translate(-12,-12)"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.005A5.99 5.99 0 0 1 12.49 10.5a3.75 3.75 0 0 1 3.26 3.75Z" fill="#c9a55c" opacity="0.28"/></g>
    <g transform="translate(600,397) scale(6.2) translate(-12,-12)"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.005A5.99 5.99 0 0 1 12.49 10.5a3.75 3.75 0 0 1 3.26 3.75Z" fill="#c9a55c" opacity="0.28"/></g>

    <g transform="translate(380,138) scale(5.8) translate(-12,-12)"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.005A5.99 5.99 0 0 1 12.49 10.5a3.75 3.75 0 0 1 3.26 3.75Z" fill="url(#fire)"/></g>
    <g transform="translate(160,398) scale(5.8) translate(-12,-12)"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.005A5.99 5.99 0 0 1 12.49 10.5a3.75 3.75 0 0 1 3.26 3.75Z" fill="url(#fire)"/></g>
    <g transform="translate(600,398) scale(5.8) translate(-12,-12)"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.005A5.99 5.99 0 0 1 12.49 10.5a3.75 3.75 0 0 1 3.26 3.75Z" fill="url(#fire)"/></g>
  </g>

  <!-- eyebrow -->
  <text x="380" y="32" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="3.2" fill="#a67c2e">THE PREACHING RHYTHM</text>

  <!-- ============ CONNECTORS (within each row) ============ -->
  <g stroke="#c9a55c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200,170 H300 M300,170 l-7,-6 M300,170 l-7,6"/>
    <path d="M420,170 H520 M520,170 l-7,-6 M520,170 l-7,6"/>
    <path d="M200,430 H300 M300,430 l-7,-6 M300,430 l-7,6"/>
    <path d="M420,430 H520 M520,430 l-7,-6 M520,430 l-7,6"/>
  </g>

  <!-- ============ STEP 1 · PRAY AND STUDY ============ -->
  <g transform="translate(160,170)">
    <circle r="40" fill="#ffffff" stroke="#d4cfc1" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#2a3447" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-13 V13" stroke-width="2.4"/>
      <path d="M0,-13 C-6,-16 -16,-16 -22,-14 V11 C-16,9 -6,9 0,12" stroke-width="2.4"/>
      <path d="M0,-13 C6,-16 16,-16 22,-14 V11 C16,9 6,9 0,12" stroke-width="2.4"/>
      <path d="M-17,-6 H-6 M-17,0 H-6 M6,-6 H17 M6,0 H17" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ============ STEP 2 · SERMON COACH — SKETCH THE OUTLINE ============ -->
  <g transform="translate(380,170)">
    <circle r="40" fill="#a67c2e" stroke="#8a6624" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#faf6ed" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14,-14 V14" stroke-width="2.4"/>
      <path d="M-14,-14 H-8" stroke-width="2.4"/>
      <path d="M-14,14 H-8" stroke-width="2.4"/>
      <path d="M-6,-8 H12" stroke-width="2.4"/>
      <path d="M-6,0 H12" stroke-width="2.4"/>
      <path d="M-6,8 H6" stroke-width="2.4"/>
      <path d="M10,4 L16,14 L11,12 Z" stroke-width="2.2"/>
    </g>
  </g>

  <!-- ============ STEP 3 · WRITE THE SERMON ============ -->
  <g transform="translate(600,170)">
    <circle r="40" fill="#ffffff" stroke="#d4cfc1" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#2a3447" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16,-16 C8,-10 -2,-1 -10,9" stroke-width="2.4"/>
      <path d="M16,-16 C19,-8 14,-1 5,4" stroke-width="2.4"/>
      <path d="M11,-11 l-5,3 M8,-7 l-5,3 M4,-2 l-5,3" stroke-width="1.4"/>
      <path d="M-10,9 l-3,6 l6,-2" stroke-width="2.2"/>
      <path d="M-18,16 H7" stroke-width="1.8"/>
    </g>
  </g>

  <!-- ============ STEP 4 · SERMON COACH — STRENGTHEN THE MANUSCRIPT ============ -->
  <g transform="translate(160,430)">
    <circle r="40" fill="#a67c2e" stroke="#8a6624" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#faf6ed" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13,-16 H6 L14,-8 V16 H-13 Z" stroke-width="2.4"/>
      <path d="M6,-16 V-8 H14" stroke-width="2.4"/>
      <path d="M-8,-6 H7 M-8,-1 H3" stroke-width="1.5"/>
      <path d="M-1,13 V4 M-5,8 L-1,4 L3,8" stroke-width="2.2"/>
    </g>
  </g>

  <!-- ============ STEP 5 · PREACH THE SERMON ============ -->
  <g transform="translate(380,430)">
    <circle r="40" fill="#ffffff" stroke="#d4cfc1" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#2a3447" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15,-2 L9,-9 L17,-4 L-7,3 Z" stroke-width="2.4"/>
      <path d="M-2,-4 L2,-6 L7,-5" stroke-width="1.6"/>
      <path d="M1,1 V14 M-9,16 H11" stroke-width="2.4"/>
      <path d="M14,-12 q5,2 5,7 M19,-15 q7,3 7,11" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ============ STEP 6 · SERMON COACH — KEEP GROWING FROM YOUR TRANSCRIPT ============ -->
  <g transform="translate(600,430)">
    <circle r="40" fill="#a67c2e" stroke="#8a6624" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#faf6ed" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-18,4 V-4 M-12,7 V-7 M-6,5 V-5" stroke-width="2.6"/>
      <path d="M-1,8 L7,0 L13,-7" stroke-width="2.4"/>
      <path d="M13,-7 V-2 M13,-7 H8" stroke-width="2.4"/>
    </g>
  </g>

  <!-- ============ NUMBER BADGES (upper right of each node, drawn last) ============ -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="188" cy="142" r="13" fill="#1a2332" stroke="#faf8f3" stroke-width="1.5"/><text x="188" y="147">1</text>
    <circle cx="408" cy="142" r="13" fill="#1a2332" stroke="#faf8f3" stroke-width="1.5"/><text x="408" y="147">2</text>
    <circle cx="628" cy="142" r="13" fill="#1a2332" stroke="#faf8f3" stroke-width="1.5"/><text x="628" y="147">3</text>
    <circle cx="188" cy="402" r="13" fill="#1a2332" stroke="#faf8f3" stroke-width="1.5"/><text x="188" y="407">4</text>
    <circle cx="408" cy="402" r="13" fill="#1a2332" stroke="#faf8f3" stroke-width="1.5"/><text x="408" y="407">5</text>
    <circle cx="628" cy="402" r="13" fill="#1a2332" stroke="#faf8f3" stroke-width="1.5"/><text x="628" y="407">6</text>
  </g>

  <!-- ============ LABELS ============ -->
  <g text-anchor="middle" fill="#1a2332" font-size="16" font-weight="600">
    <text x="160" y="252">Pray and study</text>

    <text x="380" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#a67c2e">SERMON COACH</text>
    <text x="380" y="252">Sketch the</text>
    <text x="380" y="270">outline</text>

    <text x="600" y="252">Write the sermon</text>

    <text x="160" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#a67c2e">SERMON COACH</text>
    <text x="160" y="512">Strengthen the</text>
    <text x="160" y="530">manuscript</text>

    <text x="380" y="512">Preach the sermon</text>

    <text x="600" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#a67c2e">SERMON COACH</text>
    <text x="600" y="512">Keep growing</text>
    <text x="600" y="530">from your transcript</text>
  </g>
</svg>
